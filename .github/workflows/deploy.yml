# Builds the site with Eleventy and publishes it to GitHub Pages
# every time you push to the main branch.
# One-time setup: GitHub repo → Settings → Pages → Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json is committed, so install the exact same versions.
      - run: npm ci
      - run: npm test
      # Finds the sub-folder GitHub serves the site from:
      # "/Nuno-Pinheiro" for a project site, "" for a username.github.io site.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          ELEVENTY_PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
